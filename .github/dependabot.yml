version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      nix-root:
        patterns:
          - "*"
  - package-ecosystem: "nix"
    directory: "/local"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      nix-local:
        patterns:
          - "*"
